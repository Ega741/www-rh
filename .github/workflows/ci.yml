name: ci

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge fmt
        run: forge fmt --check
        working-directory: contracts
      - name: forge build
        run: forge build --sizes
        working-directory: contracts
      - name: forge test
        run: forge test -vvv
        working-directory: contracts
      - name: fixtures are up to date
        run: forge script script/GenerateFixtures.s.sol && git diff --exit-code ../packages/shared/fixtures/quote.json
        working-directory: contracts

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # No `version:` input: the action reads `packageManager` (pnpm@10.28.0) from package.json; passing a
      # different `version` alongside it makes pnpm/action-setup@v4 fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: forge build (ABI sync check)
        run: forge build
        working-directory: contracts
      - run: node scripts/sync-abi.mjs --check
      - run: node scripts/sync-deployments.mjs --check
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - name: anvil e2e
        run: bash scripts/anvil-e2e.sh
