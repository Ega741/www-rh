name: ci

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

env:
  AGAVE_VERSION: v3.0.9

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Agave (Solana) CLI release: solana, solana-keygen, solana-test-validator, spl-token. The tarball is cached per
      # version; the e2e starts a local validator with it (docs/SPEC.md §8).
      - name: cache agave release
        id: agave-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/agave/${{ env.AGAVE_VERSION }}
          key: agave-${{ runner.os }}-x86_64-${{ env.AGAVE_VERSION }}
      - name: install agave release
        if: steps.agave-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/agave/$AGAVE_VERSION"
          mkdir -p "$dir"
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            | tar -xj -C "$dir" --strip-components=1
      - name: add agave to PATH
        run: echo "$HOME/.local/share/agave/$AGAVE_VERSION/bin" >> "$GITHUB_PATH"
      - name: solana toolchain versions
        run: |
          solana --version
          solana-keygen --version
          solana-test-validator --version
          spl-token --version

      # No `version:` input: the action reads `packageManager` (pnpm@10.28.0) from package.json; passing a
      # different `version` alongside it makes pnpm/action-setup@v4 fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: deployments.generated.ts is up to date
        run: node scripts/sync-deployments.mjs --check
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - name: web lint
        run: pnpm --filter @beagle/web run lint
      - name: solana e2e
        run: bash scripts/solana-e2e.sh
