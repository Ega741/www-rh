services:
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    env_file: .env
    environment:
      DB_PATH: /app/runner/data/runner.sqlite
      PORT: "8787"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      BROWSER_HEADLESS: "true"
    volumes:
      - runner-data:/app/runner/data
    ports:
      - "8787:8787"
    restart: unless-stopped
    shm_size: "1gb"
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-46630}
        VITE_LAUNCHPAD_ADDRESS: ${VITE_LAUNCHPAD_ADDRESS}
        VITE_RUNNER_URL: ""
        VITE_RUNNER_WS: ""
    ports:
      - "8080:80"
    depends_on:
      - runner
    restart: unless-stopped
volumes:
  runner-data:
