services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    # The whole .env is injected (one shared file, docs/SPEC.md §5.1); `environment` wins over `env_file`, so the
    # deploy-only key below is blanked instead of reaching the gateway container. Keep other deploy-only secrets
    # out of the .env used by compose (docs/DEPLOY.md §3). `required: false` lets `docker compose config` validate
    # a fresh checkout that has no .env yet (`cp .env.example .env`, docs/DEPLOY.md §3); the image runs with
    # NODE_ENV=production, so a gateway started without the file refuses to boot (SESSION_SECRET is required).
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DB_PATH: /app/data/gateway.sqlite
      DEPLOYER_PRIVATE_KEY: ""
    volumes:
      - gateway-data:/app/data
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-4663}
        VITE_GATEWAY_URL: ""
        VITE_CREDIT_DESK_ADDRESS: ${VITE_CREDIT_DESK_ADDRESS:-0x0000000000000000000000000000000000000000}
        VITE_RPC_URL: ${VITE_RPC_URL:-}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_MULTICALL: ${VITE_MULTICALL:-}
    depends_on:
      - gateway
    ports:
      - "8080:80"
    restart: unless-stopped

  # House model: OpenAI-compatible vLLM server (needs an NVIDIA GPU). Set HOUSE_BASE_URL=http://house:8000/v1 in .env.
  house:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: >
      --model openai/gpt-oss-20b --served-model-name openai/gpt-oss-20b
      --max-model-len 131072 --port 8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  # Pro house model (gpt-oss-120b, one 80 GB GPU). The gateway has ONE house endpoint (HOUSE_BASE_URL) and requests
  # both HOUSE_MODEL_SMALL and HOUSE_MODEL_LARGE from it, while each vLLM process serves one model: with
  # HOUSE_BASE_URL=http://house:8000/v1 the 120b model 404s, with http://house-large:8000/v1 the 20b model does.
  # To offer both, put an OpenAI-compatible router in front of the two services and point HOUSE_BASE_URL at it;
  # otherwise run only one of them and drop the other model from the catalog (docs/DEPLOY.md §3).
  house-large:
    profiles: ["gpu-large"]
    image: vllm/vllm-openai:latest
    command: >
      --model openai/gpt-oss-120b --served-model-name openai/gpt-oss-120b
      --max-model-len 131072 --port 8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

volumes:
  gateway-data:
  hf-cache:
