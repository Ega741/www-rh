[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ignored_warnings_from = ["lib/"]
# Defaults plus 6335 ("leave" will be promoted to a keyword): SPEC §9.2 names PonsMindRegistry.leave(address,address)
# normatively (shared TypeScript ABI); harmless with the pinned solc 0.8.37.
ignored_error_codes = [
    "license",
    "code-size",
    "init-code-size",
    "transient-storage",
    "transfer-deprecated",
    "natspec-memory-safe-assembly-deprecated",
    6335,
]
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "../packages/shared/fixtures" },
    { access = "read-write", path = "./cache" },
    { access = "read", path = "./out" },
]
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
