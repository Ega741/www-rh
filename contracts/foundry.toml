# Beagle contracts — Foundry configuration (docs/SPEC.md §3.5)
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "write", path = "../packages/shared/fixtures" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

# CI profile: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 200
depth = 40
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }

[lint]
# The spec fixes the public names `tokenDecimals`, `nativeBurn`, `feed`, `feedDecimals` (camelCase immutables).
exclude_lints = ["screaming-snake-case-immutable"]
# Tests are not production code: skip style/safety lints there.
ignore = ["test/**/*.sol"]
